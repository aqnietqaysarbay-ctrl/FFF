<!doctype html>

    <title>Devjobs Board</title>

    <style>
      :root {
        --primary: #5964e0;
        --white: #ffffff;
        --bg: #f4f6f8;
        --text-main: #19202d;
        --text-grey: #6e8098;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Kumbh Sans", sans-serif;
        background-color: var(--bg);
        padding-bottom: 60px;
      }

      /* Purple Header Area */
      .header {
        background-color: var(--primary);
        background-image: url("https://raw.githubusercontent.com/dieudonneAnane/devjobs-web-app/main/public/assets/desktop/bg-pattern-header.svg");
        background-size: cover;
        height: 160px;
        border-bottom-left-radius: 80px;
      }

      .header-content {
        max-width: 1110px;
        margin: 0 auto;
        padding: 40px 24px;
      }

      .logo {
        color: white;
        font-size: 28px;
      }

      /* Main Layout Container */
      .container {
        max-width: 1110px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* Search Bar (Overlapping the header) */
      .search-bar {
        background: var(--white);
        display: flex;
        margin-top: -40px;
        border-radius: 6px;
        padding: 16px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
      }

      .search-input,
      .location-input {
        flex: 1;
        border-right: 1px solid rgba(110, 128, 152, 0.2);
        padding: 0 16px;
      }

      .search-bar input {
        border: none;
        outline: none;
        width: 100%;
        height: 100%;
        font-size: 16px;
      }

      .search-right {
        display: flex;
        align-items: center;
        padding-left: 16px;
        gap: 16px;
      }

      /* Job Grid Layout */
      .job-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 65px 30px;
        margin-top: 80px;
        margin-bottom: 50px;
      }

      /* Individual Job Box */
      .job-card {
        background: var(--white);
        padding: 32px;
        border-radius: 6px;
        position: relative;
        transition: transform 0.2s;
      }

      .job-card:hover {
        transform: translateY(-5px);
      }

      /* The Floating Logo */
      .logo-box {
        width: 50px;
        height: 50px;
        border-radius: 15px;
        position: absolute;
        top: -25px; /* Floats half-way out of the box */
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .logo-box img {
        width: 30px;
      }

      /* Text Styles inside Box */
      .meta {
        color: var(--text-grey);
        margin-bottom: 12px;
      }
      .title {
        color: var(--text-main);
        font-size: 20px;
        margin-bottom: 12px;
      }
      .company {
        color: var(--text-grey);
        margin-bottom: 40px;
      }
      .location {
        color: var(--primary);
        font-weight: bold;
        font-size: 14px;
      }

      /* Buttons */
      .btn-search,
      .btn-load {
        background: var(--primary);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-load {
        display: block;
        margin: 0 auto;
        padding: 16px 32px;
      }
      .btn-search:hover,
      .btn-load:hover {
        background: #939bf4;
      }
    </style>
